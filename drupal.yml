version: '3.8'

services:
  web:
    image: php:7.4-apache
    container_name: web
    volumes:
      - ./html:/var/www/html
    ports:
      - "80:80"
    networks:
      - lamp-network
    depends_on:
      - db

  db:
    image: mysql:5.7
    container_name: db
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: sainath
      MYSQL_DATABASE: drupal
      MYSQL_USER: drupal
      MYSQL_PASSWORD: drupal
    networks:
      - lamp-network

  drupal:
    image: drupal:10
    container_name: drupal
    ports:
      - "8080:80"
    volumes:
      - drupal-modules:/var/www/html/modules
      - drupal-profiles:/var/www/html/profiles
      - drupal-sites:/var/www/html/sites
      - drupal-themes:/var/www/html/themes
    networks:
      - lamp-network
    depends_on:
      - db

volumes:
  db_data:
  drupal-modules:
  drupal-profiles:
  drupal-sites:
  drupal-themes:

networks:
  lamp-network:
    driver: bridge
